                              assign:
                              - buildCrawlerTools_joinSteps_switchResult_305bafe8: "${cliTools_joinStepsResult_2b01c911[(buildCrawlerTools_joinStepsIdx - 0)]}"
                - buildCrawlerTools_joinSteps_updateResult:
                    assign:
                    - buildCrawlerTools_joinStepsResult_45b907d6: "${list.concat(buildCrawlerTools_joinStepsResult_45b907d6, buildCrawlerTools_joinSteps_switchResult_305bafe8)}"
  - return:
      return:
        tools: "${buildCrawlerTools_joinStepsResult_45b907d6}"
