main:
  params:
  - "input"
  steps:
  - buildCrawlerTools_joinSteps_1:
      steps:
      - cliTools_joinSteps_1:
          steps:
          - taskTools_joinSteps_1:
              steps:
              - buildTools:
                  steps:
                  - buildTools_initResult:
                      assign:
                      - buildToolsResult_644a4211: {}
                  - buildTools_steps:
                      try:
                        steps:
                        - sessionAgent_1:
                            steps:
                            - sessionAgent_initResult:
                                assign:
                                - sessionAgentResult_1afc1290: {}
                            - sessionAgent_steps:
                                try:
                                  steps:
                                  - sessionAgent:
                                      try:
                                        steps:
                                        - sessionAgent_call:
                                            call: "http.get"
                                            args:
                                              url: "${((input.env.BASE_URL + \"/\") + (\"agents/session/\" + input.env.sessionId))}"
                                              auth:
                                                type: "${\"OIDC\"}"
                                                audience: "${input.env.BASE_URL}"
                                              headers:
                                                x-user-id: "${input.env.userId}"
                                                x-project-id: "${input.env.projectId}"
                                            result: "sessionAgentResult_5e9712fd"
                                      retry: "${http.default_retry}"
                                  - sessionAgent_updateResult:
                                      assign:
                                      - sessionAgentResult_1afc1290: "${sessionAgentResult_5e9712fd.body.agentId}"
                                except:
                                  as: "sessionAgentError"
                                  steps:
                                  - sessionAgent_updateResultError:
                                      assign:
                                      - sessionAgentResult_1afc1290: "${\"default\"}"
                        - agentTools:
                            try:
                              steps:
                              - agentTools_call:
                                  call: "http.get"
                                  args:
                                    url: "${((input.env.BASE_URL + \"/\") + ((\"agents/\" + sessionAgentResult_1afc1290) + \"/tools\"))}"
                                    auth:
                                      type: "${\"OIDC\"}"
                                      audience: "${input.env.BASE_URL}"
                                    headers:
                                      x-user-id: "${input.env.userId}"
                                      x-project-id: "${input.env.projectId}"
                                  result: "agentToolsResult_2aec73a5"
                            retry: "${http.default_retry}"
                        - toolDefs:
                            try:
                              steps:
                              - toolDefs_call:
                                  call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                                  args:
                                    workflow_id: "${\"helpers-ToolDefs${WORKFLOW_ENV}\"}"
                                    argument:
                                      toolNames: "${agentToolsResult_2aec73a5.body.tools}"
                                      env:
                                        userId: "${input.env.userId}"
                                        model: "${input.env.model}"
                                        callingWorkflowExec: "${default(\"WORKFLOW_EXECUTION_ID\", null)}"
                                        BASE_URL: "${input.env.BASE_URL}"
                                        background: "${default(map.get(input.env, \"background\"), null)}"
                                        projectId: "${input.env.projectId}"
                                        sessionId: "${input.env.sessionId}"
                                    location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                                    project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                                    connector_params:
                                      skip_polling: false
                                  result: "toolDefsResult_5c8633d0"
                            retry: "${http.default_retry}"
                        - buildTools_updateResult:
                            assign:
                            - buildToolsResult_644a4211: "${toolDefsResult_5c8633d0}"
                      except:
                        as: "buildToolsError"
                        steps:
                        - buildTools_logError:
                            try:
                              steps:
                              - buildTools_logError_call:
                                  call: "sys.log"
                                  args:
                                    text: "${(\"[buildTools_logError] \" + buildToolsError.message)}"
                                  result: "buildTools_logErrorResult_7787cabf"
                            retry: "${http.default_retry}"
                        - buildTools_updateResultError:
                            assign:
                            - buildToolsResult_644a4211: "${null}"
              - buildTaskTools:
                  steps:
                  - buildTaskTools_initResult:
                      assign:
                      - buildTaskToolsResult_54b2995e: []
                  - buildTaskTools_steps:
                      for:
                        value: "buildTaskToolsIdx"
                        range: "${[0, (2 - 1)]}"
                        steps:
                        - buildTaskTools_switch:
                            steps:
                            - buildTaskTools_switch_initResult:
                                assign:
                                - buildTaskTools_switchResult_6d73b683: {}
                            - buildTaskTools_switch_steps:
                                switch:
                                - condition: "${(buildTaskToolsIdx == 0)}"
                                  steps:
                                  - buildTaskTools_switch_updateResult_0:
                                      assign:
                                      - buildTaskTools_switchResult_6d73b683:
                                          type: "${\"function\"}"
                                          function:
                                            name: "${\"CREATE_TASK\"}"
                                            description: "${\"Create a task in the current user's scope. Session is inferred by the current CLI workflow session.\"}"
                                            parameters:
                                              type: "object"
                                              properties:
                                                title:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default(null, null)}"
                                                  required: "${default(null, null)}"
                                                description:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default(null, null)}"
                                                  required: "${default(null, null)}"
                                                status:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default([\"Queued\", \"In Progress\", \"Done\", \"Stuck\"], null)}"
                                                  required: "${default(null, null)}"
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                          workflowName: "${\"tools-Tasks\"}"
                                - condition: "${(buildTaskToolsIdx == 1)}"
                                  steps:
                                  - buildTaskTools_switch_updateResult_1:
                                      assign:
                                      - buildTaskTools_switchResult_6d73b683:
                                          type: "${\"function\"}"
                                          function:
                                            name: "${\"UPDATE_TASK\"}"
                                            description: "${\"Update a task by id in the current user's scope (session inferred).\"}"
                                            parameters:
                                              type: "object"
                                              properties:
                                                id:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default(null, null)}"
                                                  required: "${default(null, null)}"
                                                title:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default(null, null)}"
                                                  required: "${default(null, null)}"
                                                description:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default(null, null)}"
                                                  required: "${default(null, null)}"
                                                status:
                                                  type: "string"
                                                  properties: {}
                                                  enum: "${default([\"Queued\", \"In Progress\", \"Done\", \"Stuck\"], null)}"
                                                  required: "${default(null, null)}"
                                              enum: "${default(null, null)}"
                                              required: "${default([\"id\"], null)}"
                                          workflowName: "${\"tools-Tasks\"}"
                        - buildTaskTools_updateResult:
                            assign:
                            - buildTaskToolsResult_54b2995e: "${list.concat(buildTaskToolsResult_54b2995e, buildTaskTools_switchResult_6d73b683)}"
              - taskTools_joinSteps:
                  steps:
                  - taskTools_joinSteps_initResult:
                      assign:
                      - taskTools_joinStepsResult_17f83461: []
                  - taskTools_joinSteps_steps:
                      for:
                        value: "taskTools_joinStepsIdx"
                        range: "${[0, (((0 + len(buildToolsResult_644a4211.defs)) + len(buildTaskToolsResult_54b2995e)) - 1)]}"
                        steps:
                        - taskTools_joinSteps_switch:
                            steps:
                            - taskTools_joinSteps_switch_initResult:
                                assign:
                                - taskTools_joinSteps_switchResult_191b3092: {}
                            - taskTools_joinSteps_switch_steps:
                                switch:
                                - condition: "${(taskTools_joinStepsIdx >= (0 + len(buildToolsResult_644a4211.defs)))}"
                                  steps:
                                  - taskTools_joinSteps_switch_updateResult_0:
                                      assign:
                                      - taskTools_joinSteps_switchResult_191b3092: "${buildTaskToolsResult_54b2995e[(taskTools_joinStepsIdx - (0 + len(buildToolsResult_644a4211.defs)))]}"
                                - condition: "${(taskTools_joinStepsIdx >= 0)}"
                                  steps:
                                  - taskTools_joinSteps_switch_updateResult_1:
                                      assign:
                                      - taskTools_joinSteps_switchResult_191b3092: "${buildToolsResult_644a4211.defs[(taskTools_joinStepsIdx - 0)]}"
                        - taskTools_joinSteps_updateResult:
                            assign:
                            - taskTools_joinStepsResult_17f83461: "${list.concat(taskTools_joinStepsResult_17f83461, taskTools_joinSteps_switchResult_191b3092)}"
          - buildCliTools:
              steps:
              - buildCliTools_initResult:
                  assign:
                  - buildCliToolsResult_14b1157b: []
              - buildCliTools_steps:
                  for:
                    value: "buildCliToolsIdx"
                    range: "${[0, (3 - 1)]}"
                    steps:
                    - buildCliTools_switch:
                        steps:
                        - buildCliTools_switch_initResult:
                            assign:
                            - buildCliTools_switchResult_6d76d17d: {}
                        - buildCliTools_switch_steps:
                            switch:
                            - condition: "${(buildCliToolsIdx == 0)}"
                              steps:
                              - buildCliTools_switch_updateResult_0:
                                  assign:
                                  - buildCliTools_switchResult_6d76d17d:
                                      type: "${\"function\"}"
                                      function:
                                        name: "${\"READ_FILE\"}"
                                        description: "${\"Read a file from disk.\"}"
                                        parameters:
                                          type: "object"
                                          properties:
                                            filepath:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                          enum: "${default(null, null)}"
                                          required: "${default([\"filepath\"], null)}"
                                      workflowName: "${\"tools-CliTools\"}"
                            - condition: "${(buildCliToolsIdx == 1)}"
                              steps:
                              - buildCliTools_switch_updateResult_1:
                                  assign:
                                  - buildCliTools_switchResult_6d76d17d:
                                      type: "${\"function\"}"
                                      function:
                                        name: "${\"RUN_COMMAND\"}"
                                        description: "${\"Execute a shell command.\"}"
                                        parameters:
                                          type: "object"
                                          properties:
                                            command:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                          enum: "${default(null, null)}"
                                          required: "${default([\"command\"], null)}"
                                      workflowName: "${\"tools-CliTools\"}"
                            - condition: "${(buildCliToolsIdx == 2)}"
                              steps:
                              - buildCliTools_switch_updateResult_2:
                                  assign:
                                  - buildCliTools_switchResult_6d76d17d:
                                      type: "${\"function\"}"
                                      function:
                                        name: "${\"UPDATE_FILE\"}"
                                        description: "${\"Update a file on disk with provided content\"}"
                                        parameters:
                                          type: "object"
                                          properties:
                                            filepath:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                            content:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                          enum: "${default(null, null)}"
                                          required: "${default([\"filepath\", \"content\"], null)}"
                                      workflowName: "${\"tools-CliTools\"}"
                    - buildCliTools_updateResult:
                        assign:
                        - buildCliToolsResult_14b1157b: "${list.concat(buildCliToolsResult_14b1157b, buildCliTools_switchResult_6d76d17d)}"
          - cliTools_joinSteps:
              steps:
              - cliTools_joinSteps_initResult:
                  assign:
                  - cliTools_joinStepsResult_2b01c911: []
              - cliTools_joinSteps_steps:
                  for:
                    value: "cliTools_joinStepsIdx"
                    range: "${[0, (((0 + len(taskTools_joinStepsResult_17f83461)) + len(buildCliToolsResult_14b1157b)) - 1)]}"
                    steps:
                    - cliTools_joinSteps_switch:
                        steps:
                        - cliTools_joinSteps_switch_initResult:
                            assign:
                            - cliTools_joinSteps_switchResult_3e39dfe9: {}
                        - cliTools_joinSteps_switch_steps:
                            switch:
                            - condition: "${(cliTools_joinStepsIdx >= (0 + len(taskTools_joinStepsResult_17f83461)))}"
                              steps:
                              - cliTools_joinSteps_switch_updateResult_0:
                                  assign:
                                  - cliTools_joinSteps_switchResult_3e39dfe9: "${buildCliToolsResult_14b1157b[(cliTools_joinStepsIdx - (0 + len(taskTools_joinStepsResult_17f83461)))]}"
                            - condition: "${(cliTools_joinStepsIdx >= 0)}"
                              steps:
                              - cliTools_joinSteps_switch_updateResult_1:
                                  assign:
                                  - cliTools_joinSteps_switchResult_3e39dfe9: "${taskTools_joinStepsResult_17f83461[(cliTools_joinStepsIdx - 0)]}"
                    - cliTools_joinSteps_updateResult:
                        assign:
                        - cliTools_joinStepsResult_2b01c911: "${list.concat(cliTools_joinStepsResult_2b01c911, cliTools_joinSteps_switchResult_3e39dfe9)}"
      - buildCrawlerTools:
          steps:
          - buildCrawlerTools_initResult:
              assign:
              - buildCrawlerToolsResult_6cd089f0: []
          - buildCrawlerTools_steps:
              for:
                value: "buildCrawlerToolsIdx"
                range: "${[0, (1 - 1)]}"
                steps:
                - buildCrawlerTools_switch:
                    steps:
                    - buildCrawlerTools_switch_initResult:
                        assign:
                        - buildCrawlerTools_switchResult_4004771e: {}
                    - buildCrawlerTools_switch_steps:
                        switch:
                        - condition: "${(buildCrawlerToolsIdx == 0)}"
                          steps:
                          - buildCrawlerTools_switch_updateResult_0:
                              assign:
                              - buildCrawlerTools_switchResult_4004771e:
                                  type: "${\"function\"}"
                                  function:
                                    name: "${\"SPAWN_CRAWLERS\"}"
                                    description: "${\"Spawn crawlers from a producer command.\nSpawn crawlers when a task requires applying\na uniform approach to all nodes in a tree\n(files, webpages, knowledge graph, etc.)\n\n- producerCommand: Your command must result in a list\n  where each line is an item that will be assigned it's own agent.\n  (directories, files, webpages, sub topics, sub regions, etc.)\n\n- instructions: The instructions for the sub-agents.\n  The context of the overall task at hand and\n  what they need to accomplish in their own unique domain.\n\n- task: Initialize the task assigned to each crawler.\n  The task should include a description and\n  a TODO list for the agent to update incrementally.\n\nEach sub-agent will receive their assigned line and your general instructions.\n        \"}"
                                    parameters:
                                      type: "object"
                                      properties:
                                        producerCommand:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                        instructions:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                        task:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                        perCrawlerBudget:
                                          type: "number"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                      enum: "${default(null, null)}"
                                      required: "${default([\"producerCommand\", \"instructions\", \"task\", \"perCrawlerBudget\"], null)}"
                                  workflowName: "${\"tools-SpawnCrawlers\"}"
                - buildCrawlerTools_updateResult:
                    assign:
                    - buildCrawlerToolsResult_6cd089f0: "${list.concat(buildCrawlerToolsResult_6cd089f0, buildCrawlerTools_switchResult_4004771e)}"
      - buildCrawlerTools_joinSteps:
          steps:
          - buildCrawlerTools_joinSteps_initResult:
              assign:
              - buildCrawlerTools_joinStepsResult_45b907d6: []
          - buildCrawlerTools_joinSteps_steps:
              for:
                value: "buildCrawlerTools_joinStepsIdx"
                range: "${[0, (((0 + len(cliTools_joinStepsResult_2b01c911)) + len(buildCrawlerToolsResult_6cd089f0)) - 1)]}"
                steps:
                - buildCrawlerTools_joinSteps_switch:
                    steps:
                    - buildCrawlerTools_joinSteps_switch_initResult:
                        assign:
                        - buildCrawlerTools_joinSteps_switchResult_305bafe8: {}
                    - buildCrawlerTools_joinSteps_switch_steps:
                        switch:
                        - condition: "${(buildCrawlerTools_joinStepsIdx >= (0 + len(cliTools_joinStepsResult_2b01c911)))}"
                          steps:
                          - buildCrawlerTools_joinSteps_switch_updateResult_0:
                              assign:
                              - buildCrawlerTools_joinSteps_switchResult_305bafe8: "${buildCrawlerToolsResult_6cd089f0[(buildCrawlerTools_joinStepsIdx - (0 + len(cliTools_joinStepsResult_2b01c911)))]}"
                        - condition: "${(buildCrawlerTools_joinStepsIdx >= 0)}"
                          steps:
