main:
  params:
  - "input"
  steps:
  - current_switch:
      steps:
      - current_get:
          try:
            steps:
            - current_get_call:
                call: "http.get"
                args:
                  url: "${((input.env.BASE_URL + \"/\") + ((\"tasks/by-session/\" + input.env.sessionId) + (((((\"?status=\" + \"In%20Progress\") + \"&limit=\") + 1) + \"&order=\") + \"desc\")))}"
                  auth:
                    type: "${\"OIDC\"}"
                    audience: "${input.env.BASE_URL}"
                  headers:
                    x-user-id: "${input.env.userId}"
                    x-project-id: "${input.env.projectId}"
                result: "current_getResult_2796be29"
          retry: "${http.default_retry}"
      - current_content:
          steps:
          - current_content_initResult:
              assign:
              - current_contentResult_341db686: {}
          - current_content_steps:
              switch:
              - condition: "${((get_type(current_getResult_2796be29.body) == \"map\") and (len(current_getResult_2796be29.body.tasks) > 0))}"
                steps:
                - current_content_updateResult_0:
                    assign:
                    - current_contentResult_341db686:
                        role: "${\"system\"}"
                        content: "${(((((((((\"Current task\" + \": id=\") + string(current_getResult_2796be29.body.tasks[0].id)) + \" | \") + string(current_getResult_2796be29.body.tasks[0].title)) + \" — \") + string(current_getResult_2796be29.body.tasks[0].description)) + \" [status=\") + string(current_getResult_2796be29.body.tasks[0].status)) + \"]\")}"
                        tool_calls: "${[]}"
                        tool_call_id: "${null}"
                        create_time: "${sys.now()}"
                        docId: "${null}"
              - condition: "${(get_type(current_getResult_2796be29.body) == \"map\")}"
                steps:
                - current_content_updateResult_1:
                    assign:
                    - current_contentResult_341db686:
                        role: "${\"system\"}"
                        content: "${((\"Current task\" + \": \") + \"None found for session\")}"
                        tool_calls: "${[]}"
                        tool_call_id: "${null}"
                        create_time: "${sys.now()}"
                        docId: "${null}"
              - condition: "${true}"
                steps:
                - current_content_updateResult_2:
                    assign:
                    - current_contentResult_341db686:
                        role: "${\"system\"}"
                        content: "${(((((\"Current task\" + \": \") + \"Tasks endpoint returned non-object body. get_type=\") + get_type(current_getResult_2796be29.body)) + \", body=\") + string(current_getResult_2796be29.body))}"
                        tool_calls: "${[]}"
                        tool_call_id: "${null}"
                        create_time: "${sys.now()}"
                        docId: "${null}"
  - pending_switch:
      steps:
      - pending_get:
          try:
            steps:
            - pending_get_call:
                call: "http.get"
                args:
                  url: "${((input.env.BASE_URL + \"/\") + ((\"tasks/by-session/\" + input.env.sessionId) + (((((\"?status=\" + \"Queued\") + \"&limit=\") + 1) + \"&order=\") + \"asc\")))}"
                  auth:
                    type: "${\"OIDC\"}"
                    audience: "${input.env.BASE_URL}"
                  headers:
                    x-user-id: "${input.env.userId}"
                    x-project-id: "${input.env.projectId}"
                result: "pending_getResult_1d162174"
          retry: "${http.default_retry}"
      - pending_content:
          steps:
          - pending_content_initResult:
              assign:
              - pending_contentResult_3f5abb37: {}
          - pending_content_steps:
              switch:
              - condition: "${((get_type(pending_getResult_1d162174.body) == \"map\") and (len(pending_getResult_1d162174.body.tasks) > 0))}"
                steps:
                - pending_content_updateResult_0:
                    assign:
                    - pending_contentResult_3f5abb37:
                        role: "${\"system\"}"
                        content: "${(((((((((\"Oldest pending task\" + \": id=\") + string(pending_getResult_1d162174.body.tasks[0].id)) + \" | \") + string(pending_getResult_1d162174.body.tasks[0].title)) + \" — \") + string(pending_getResult_1d162174.body.tasks[0].description)) + \" [status=\") + string(pending_getResult_1d162174.body.tasks[0].status)) + \"]\")}"
                        tool_calls: "${[]}"
                        tool_call_id: "${null}"
                        create_time: "${sys.now()}"
                        docId: "${null}"
              - condition: "${(get_type(pending_getResult_1d162174.body) == \"map\")}"
                steps:
                - pending_content_updateResult_1:
                    assign:
                    - pending_contentResult_3f5abb37:
                        role: "${\"system\"}"
                        content: "${((\"Oldest pending task\" + \": \") + \"None found for session\")}"
                        tool_calls: "${[]}"
                        tool_call_id: "${null}"
                        create_time: "${sys.now()}"
                        docId: "${null}"
              - condition: "${true}"
                steps:
                - pending_content_updateResult_2:
                    assign:
                    - pending_contentResult_3f5abb37:
                        role: "${\"system\"}"
                        content: "${(((((\"Oldest pending task\" + \": \") + \"Tasks endpoint returned non-object body. get_type=\") + get_type(pending_getResult_1d162174.body)) + \", body=\") + string(pending_getResult_1d162174.body))}"
                        tool_calls: "${[]}"
                        tool_call_id: "${null}"
                        create_time: "${sys.now()}"
                        docId: "${null}"
  - done_switch:
      steps:
      - done_get:
          try:
            steps:
            - done_get_call:
                call: "http.get"
                args:
                  url: "${((input.env.BASE_URL + \"/\") + ((\"tasks/by-session/\" + input.env.sessionId) + (((((\"?status=\" + \"Done\") + \"&limit=\") + 1) + \"&order=\") + \"desc\")))}"
