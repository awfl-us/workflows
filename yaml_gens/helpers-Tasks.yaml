          retry: "${http.default_retry}"
      - done_content:
          steps:
          - done_content_initResult:
              assign:
              - done_contentResult_135058dc: {}
          - done_content_steps:
              switch:
              - condition: "${((get_type(done_getResult_727cde97.body) == \"map\") and (len(done_getResult_727cde97.body.tasks) > 0))}"
                steps:
                - done_content_updateResult_0:
                    assign:
                    - done_contentResult_135058dc:
                        role: "${\"system\"}"
                        content: "${(((((((((\"Newest complete task\" + \": id=\") + string(done_getResult_727cde97.body.tasks[0].id)) + \" | \") + string(done_getResult_727cde97.body.tasks[0].title)) + \" — \") + string(done_getResult_727cde97.body.tasks[0].description)) + \" [status=\") + string(done_getResult_727cde97.body.tasks[0].status)) + \"]\")}"
                        tool_calls: "${[]}"
