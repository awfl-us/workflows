            steps:
            - plainToCodeMessages_switch:
                steps:
                - plainToCodeMessages_switch_initResult:
                    assign:
                    - plainToCodeMessages_switchResult_681d7455: {}
                - plainToCodeMessages_switch_steps:
                    switch:
                    - condition: "${(plainToCodeMessagesIdx == 0)}"
                      steps:
                      - plainToCodeMessages_switch_updateResult_0:
                          assign:
                          - plainToCodeMessages_switchResult_681d7455:
                              role: "${\"system\"}"
                              content: "${\"\nYou are PlainToCodeHook. Convert a plain technical-English specification into a complete, compilable source file.\nOperating rules:\n - Infer the target language, package, and imports from the file path and context.\n - Preserve behavior, data flow, side effects, error handling, and formatting.\n - Include the correct package declaration when applicable.\n - Return only the full code of the file; no backticks, no commentary.\n      \"}"
                              tool_calls: "${[]}"
                              tool_call_id: "${null}"
                              create_time: "${sys.now()}"
                              docId: "${null}"
                    - condition: "${(plainToCodeMessagesIdx == 1)}"
                      steps:
                      - plainToCodeMessages_switch_updateResult_1:
                          assign:
                          - plainToCodeMessages_switchResult_681d7455:
                              role: "${\"user\"}"
                              content: "${(\"Plain specification follows:\n\n\" + map.get(json.decode(readPlain_runResult_2a06fba6.encoded), \"content\"))}"
                              tool_calls: "${[]}"
                              tool_call_id: "${null}"
                              create_time: "${sys.now()}"
                              docId: "${null}"
            - plainToCodeMessages_updateResult:
                assign:
                - plainToCodeMessagesResult_20b7a8c: "${list.concat(plainToCodeMessagesResult_20b7a8c, plainToCodeMessages_switchResult_681d7455)}"
  - chatBlock:
      steps:
      - toolChoice:
          steps:
          - toolChoice_initResult:
              assign:
              - toolChoiceResult_6055570a: {}
          - toolChoice_steps:
              switch:
              - condition: "${((null != null) and (len(null) > 0))}"
                steps:
                - toolChoice_updateResult_0:
                    assign:
                    - toolChoiceResult_6055570a: "${null}"
              - condition: "${true}"
                steps:
                - toolChoice_updateResult_1:
                    assign:
                    - toolChoiceResult_6055570a: "${null}"
      - plain_to_code:
          try:
            steps:
            - plain_to_code_call:
                call: "http.post"
                args:
                  url: "${((input.env.BASE_URL + \"/\") + \"llm/chat\")}"
                  body:
                    messages: "${plainToCodeMessagesResult_20b7a8c}"
                    model: "${\"gpt-4o\"}"
                    temperature: 0.2
                    max_completion_tokens: "${null}"
                    response_format:
                      type: "text"
                    tools: "${null}"
                    tool_choice: "${toolChoiceResult_6055570a}"
                  auth:
                    type: "${\"OIDC\"}"
                    audience: "${input.env.BASE_URL}"
                  headers:
                    x-user-id: "${input.env.userId}"
                    x-project-id: "${input.env.projectId}"
                result: "plain_to_codeResult_20589790"
          retry: "${http.default_retry}"
  - mkdirCode_output:
      steps:
      - mkdirCode_call_block:
          steps:
          - buildParams_1:
              steps:
              - buildParams_initResult_1:
                  assign:
                  - buildParamsResult_80431ca: {}
              - buildParams_steps_1:
                  try:
                    steps:
                    - buildParams_updateResult_1:
                        assign:
                        - buildParamsResult_80431ca:
                            command: "${((\"bash -lc 'mkdir -p $(dirname \" + input.filepath) + \")'\")}"
