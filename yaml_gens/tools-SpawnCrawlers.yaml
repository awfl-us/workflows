main:
  params:
  - "input"
  steps:
  - spawn:
      steps:
      - spawn_initResult:
          assign:
          - spawnResult_7f3a6752: []
      - spawn_steps:
          parallel:
            shared:
            - "spawnResult_7f3a6752"
            for:
              value: "spawnValue"
              in: "${json.decode(input.tool_call.function.arguments).items}"
              steps:
              - tryRun:
                  steps:
                  - tryRun_initResult:
                      assign:
                      - tryRunResult_6520d547: {}
                  - tryRun_steps:
                      try:
                        steps:
                        - codebase_Crawler:
                            try:
                              steps:
                              - codebase_Crawler_call:
                                  call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                                  args:
                                    workflow_id: "${\"codebase-Crawler${WORKFLOW_ENV}\"}"
                                    argument:
                                      query: "${(((\"Your sole responsibility/area of focus is: \" + spawnValue) + \"\\n\") + json.decode(input.tool_call.function.arguments).instructions)}"
                                      fund: "${json.decode(input.tool_call.function.arguments).perCrawlerBudget}"
                                      spent: "${default(0, null)}"
                                      task:
                                        title: "${json.decode(input.tool_call.function.arguments).task.title}"
                                        description: "${(((\"Your sole responsibility/area of focus is: \" + spawnValue) + \"\\n\") + json.decode(input.tool_call.function.arguments).task.description)}"
                                        status: "${json.decode(input.tool_call.function.arguments).task.status}"
                                      toolChoice: "${default(null, null)}"
                                      sideCall: "${default(false, null)}"
                                      env:
                                        userId: "${input.env.userId}"
                                        model: "${input.env.model}"
                                        callingWorkflowExec: "${default(map.get(input.env, \"callingWorkflowExec\"), null)}"
                                        BASE_URL: "${input.env.BASE_URL}"
                                        background: "${default(map.get(input.env, \"background\"), null)}"
                                        projectId: "${input.env.projectId}"
                                        sessionId: "${(\"crawler_\" + base64.encode(text.encode(spawnValue, \"UTF-8\")))}"
                                    location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                                    project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                                    connector_params:
                                      skip_polling: false
                                  result: "codebase_CrawlerResult_622744e2"
                            retry: "${http.default_retry}"
                        - tryRun_updateResult:
                            assign:
                            - tryRunResult_6520d547:
                                response: "${(((\"Response from the agent assigned to \" + spawnValue) + \":\\n\") + codebase_CrawlerResult_622744e2.message.content)}"
                                cost: "${codebase_CrawlerResult_622744e2.total_cost}"
                      except:
                        as: "tryRunError"
                        steps:
                        - tryRun_updateResultError:
                            assign:
                            - tryRunResult_6520d547:
                                response: "${(((\"The crawler assigned to \" + spawnValue) + \" failed: \") + tryRunError.message)}"
                                cost: "${0}"
              - spawn_updateResult:
                  assign:
                  - spawnResult_7f3a6752: "${list.concat(spawnResult_7f3a6752, tryRunResult_6520d547)}"
  - sumSpent:
      steps:
      - sumSpent_initResult:
          assign:
          - sumSpentResult_4e151569: "${0}"
      - sumSpent_steps:
          for:
            value: "sumSpentValue"
            in: "${spawnResult_7f3a6752}"
            steps:
            - sumSpent_updateResult:
                assign:
                - sumSpentResult_4e151569: "${(sumSpentResult_4e151569 + sumSpentValue.cost)}"
  - return:
      return:
        encoded: "${json.encode_to_string(spawnResult_7f3a6752)}"
        cost: "${sumSpentResult_4e151569}"
