main:
  params:
  - "input"
  steps:
  - cliTools_joinSteps_1:
      steps:
      - taskTools_joinSteps_1:
          steps:
          - buildTools:
              steps:
              - buildTools_initResult:
                  assign:
                  - buildToolsResult_69c92fc: {}
              - buildTools_steps:
                  try:
                    steps:
                    - sessionAgent_1:
                        steps:
                        - sessionAgent_initResult:
                            assign:
                            - sessionAgentResult_1afc1290: {}
                        - sessionAgent_steps:
                            try:
                              steps:
                              - sessionAgent:
                                  try:
                                    steps:
                                    - sessionAgent_call:
                                        call: "http.get"
                                        args:
                                          url: "${((input.env.BASE_URL + \"/\") + (\"agents/session/\" + input.env.sessionId))}"
                                          auth:
                                            type: "${\"OIDC\"}"
                                            audience: "${input.env.BASE_URL}"
                                          headers:
                                            x-user-id: "${input.env.userId}"
                                            x-project-id: "${input.env.projectId}"
                                        result: "sessionAgentResult_5e9712fd"
                                  retry: "${http.default_retry}"
                              - sessionAgent_updateResult:
                                  assign:
                                  - sessionAgentResult_1afc1290: "${sessionAgentResult_5e9712fd.body.agentId}"
                            except:
                              as: "sessionAgentError"
                              steps:
                              - sessionAgent_updateResultError:
                                  assign:
                                  - sessionAgentResult_1afc1290: "${\"default\"}"
                    - agentTools:
                        try:
                          steps:
                          - agentTools_call:
                              call: "http.get"
                              args:
                                url: "${((input.env.BASE_URL + \"/\") + ((\"agents/\" + sessionAgentResult_1afc1290) + \"/tools\"))}"
                                auth:
                                  type: "${\"OIDC\"}"
                                  audience: "${input.env.BASE_URL}"
                                headers:
                                  x-user-id: "${input.env.userId}"
                                  x-project-id: "${input.env.projectId}"
                              result: "agentToolsResult_2aec73a5"
                        retry: "${http.default_retry}"
                    - toolDefs:
                        try:
                          steps:
                          - toolDefs_call:
                              call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                              args:
                                workflow_id: "${\"helpers-ToolDefs${WORKFLOW_ENV}\"}"
                                argument:
                                  toolNames: "${agentToolsResult_2aec73a5.body.tools}"
                                  env:
                                    userId: "${input.env.userId}"
                                    model: "${input.env.model}"
                                    callingWorkflowExec: "${default(\"WORKFLOW_EXECUTION_ID\", null)}"
                                    BASE_URL: "${input.env.BASE_URL}"
                                    background: "${default(map.get(input.env, \"background\"), null)}"
                                    projectId: "${input.env.projectId}"
                                    sessionId: "${input.env.sessionId}"
                                    workbranch: "${default(map.get(input.env, \"workbranch\"), null)}"
                                location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                                project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                                connector_params:
                                  skip_polling: false
                              result: "toolDefsResult_220dace2"
                        retry: "${http.default_retry}"
                    - buildTools_updateResult:
                        assign:
                        - buildToolsResult_69c92fc: "${toolDefsResult_220dace2}"
                  except:
                    as: "buildToolsError"
                    steps:
                    - buildTools_logError:
                        try:
                          steps:
                          - buildTools_logError_call:
                              call: "sys.log"
                              args:
                                text: "${(\"[buildTools_logError] \" + buildToolsError.message)}"
                              result: "buildTools_logErrorResult_7787cabf"
                        retry: "${http.default_retry}"
                    - buildTools_updateResultError:
                        assign:
                        - buildToolsResult_69c92fc: "${null}"
          - buildTaskTools:
              steps:
              - buildTaskTools_initResult:
                  assign:
                  - buildTaskToolsResult_21f843f3: []
              - buildTaskTools_steps:
                  for:
                    value: "buildTaskToolsIdx"
                    range: "${[0, (2 - 1)]}"
                    steps:
                    - buildTaskTools_switch:
                        steps:
                        - buildTaskTools_switch_initResult:
                            assign:
                            - buildTaskTools_switchResult_68700c30: {}
                        - buildTaskTools_switch_steps:
                            switch:
                            - condition: "${(buildTaskToolsIdx == 0)}"
                              steps:
                              - buildTaskTools_switch_updateResult_0:
                                  assign:
                                  - buildTaskTools_switchResult_68700c30:
                                      type: "${\"function\"}"
                                      function:
                                        name: "${\"CREATE_TASK\"}"
                                        description: "${\"Create a task in the current user's scope. Session is inferred by the current CLI workflow session.\"}"
                                        parameters:
                                          type: "object"
                                          properties:
                                            title:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                            description:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                            status:
                                              type: "string"
                                              properties: {}
                                              enum: "${default([\"Queued\", \"In Progress\", \"Done\", \"Stuck\"], null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                          items: "${null}"
                                      workflowName: "${\"tools-Tasks\"}"
                            - condition: "${(buildTaskToolsIdx == 1)}"
                              steps:
                              - buildTaskTools_switch_updateResult_1:
                                  assign:
                                  - buildTaskTools_switchResult_68700c30:
                                      type: "${\"function\"}"
                                      function:
                                        name: "${\"UPDATE_TASK\"}"
                                        description: "${\"Update a task by id in the current user's scope (session inferred).\"}"
                                        parameters:
                                          type: "object"
                                          properties:
                                            id:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                            title:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                            description:
                                              type: "string"
                                              properties: {}
                                              enum: "${default(null, null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                            status:
                                              type: "string"
                                              properties: {}
                                              enum: "${default([\"Queued\", \"In Progress\", \"Done\", \"Stuck\"], null)}"
                                              required: "${default(null, null)}"
                                              items: "${null}"
                                          enum: "${default(null, null)}"
                                          required: "${default([\"id\"], null)}"
                                          items: "${null}"
                                      workflowName: "${\"tools-Tasks\"}"
                    - buildTaskTools_updateResult:
                        assign:
                        - buildTaskToolsResult_21f843f3: "${list.concat(buildTaskToolsResult_21f843f3, buildTaskTools_switchResult_68700c30)}"
          - taskTools_joinSteps:
              steps:
              - taskTools_joinSteps_initResult:
                  assign:
                  - taskTools_joinStepsResult_633af29b: []
              - taskTools_joinSteps_steps:
                  for:
                    value: "taskTools_joinStepsIdx"
                    range: "${[0, (((0 + len(buildToolsResult_69c92fc.defs)) + len(buildTaskToolsResult_21f843f3)) - 1)]}"
                    steps:
                    - taskTools_joinSteps_switch:
                        steps:
                        - taskTools_joinSteps_switch_initResult:
                            assign:
                            - taskTools_joinSteps_switchResult_6ad0a952: {}
                        - taskTools_joinSteps_switch_steps:
                            switch:
                            - condition: "${(taskTools_joinStepsIdx >= (0 + len(buildToolsResult_69c92fc.defs)))}"
                              steps:
                              - taskTools_joinSteps_switch_updateResult_0:
                                  assign:
                                  - taskTools_joinSteps_switchResult_6ad0a952: "${buildTaskToolsResult_21f843f3[(taskTools_joinStepsIdx - (0 + len(buildToolsResult_69c92fc.defs)))]}"
                            - condition: "${(taskTools_joinStepsIdx >= 0)}"
                              steps:
                              - taskTools_joinSteps_switch_updateResult_1:
                                  assign:
                                  - taskTools_joinSteps_switchResult_6ad0a952: "${buildToolsResult_69c92fc.defs[(taskTools_joinStepsIdx - 0)]}"
                    - taskTools_joinSteps_updateResult:
                        assign:
                        - taskTools_joinStepsResult_633af29b: "${list.concat(taskTools_joinStepsResult_633af29b, taskTools_joinSteps_switchResult_6ad0a952)}"
      - buildCliTools:
          steps:
          - buildCliTools_initResult:
              assign:
              - buildCliToolsResult_5b6a634a: []
          - buildCliTools_steps:
              for:
                value: "buildCliToolsIdx"
                range: "${[0, (3 - 1)]}"
                steps:
                - buildCliTools_switch:
                    steps:
                    - buildCliTools_switch_initResult:
                        assign:
                        - buildCliTools_switchResult_2f25c872: {}
                    - buildCliTools_switch_steps:
                        switch:
                        - condition: "${(buildCliToolsIdx == 0)}"
                          steps:
                          - buildCliTools_switch_updateResult_0:
                              assign:
                              - buildCliTools_switchResult_2f25c872:
                                  type: "${\"function\"}"
                                  function:
                                    name: "${\"READ_FILE\"}"
                                    description: "${\"Read a file from disk.\"}"
                                    parameters:
                                      type: "object"
                                      properties:
                                        filepath:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                          items: "${null}"
                                      enum: "${default(null, null)}"
                                      required: "${default([\"filepath\"], null)}"
                                      items: "${null}"
                                  workflowName: "${\"tools-CliTools\"}"
                        - condition: "${(buildCliToolsIdx == 1)}"
                          steps:
                          - buildCliTools_switch_updateResult_1:
                              assign:
                              - buildCliTools_switchResult_2f25c872:
                                  type: "${\"function\"}"
                                  function:
                                    name: "${\"RUN_COMMAND\"}"
                                    description: "${\"Execute a shell command.\"}"
                                    parameters:
                                      type: "object"
                                      properties:
                                        command:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                          items: "${null}"
                                      enum: "${default(null, null)}"
                                      required: "${default([\"command\"], null)}"
                                      items: "${null}"
                                  workflowName: "${\"tools-CliTools\"}"
                        - condition: "${(buildCliToolsIdx == 2)}"
                          steps:
                          - buildCliTools_switch_updateResult_2:
                              assign:
                              - buildCliTools_switchResult_2f25c872:
                                  type: "${\"function\"}"
                                  function:
                                    name: "${\"UPDATE_FILE\"}"
                                    description: "${\"Update a file on disk with provided content\"}"
                                    parameters:
                                      type: "object"
                                      properties:
                                        filepath:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                          items: "${null}"
                                        content:
                                          type: "string"
                                          properties: {}
                                          enum: "${default(null, null)}"
                                          required: "${default(null, null)}"
                                          items: "${null}"
                                      enum: "${default(null, null)}"
                                      required: "${default([\"filepath\", \"content\"], null)}"
                                      items: "${null}"
                                  workflowName: "${\"tools-CliTools\"}"
                - buildCliTools_updateResult:
                    assign:
                    - buildCliToolsResult_5b6a634a: "${list.concat(buildCliToolsResult_5b6a634a, buildCliTools_switchResult_2f25c872)}"
      - cliTools_joinSteps:
          steps:
          - cliTools_joinSteps_initResult:
              assign:
              - cliTools_joinStepsResult_72d0b263: []
          - cliTools_joinSteps_steps:
              for:
                value: "cliTools_joinStepsIdx"
                range: "${[0, (((0 + len(taskTools_joinStepsResult_633af29b)) + len(buildCliToolsResult_5b6a634a)) - 1)]}"
                steps:
                - cliTools_joinSteps_switch:
                    steps:
                    - cliTools_joinSteps_switch_initResult:
                        assign:
                        - cliTools_joinSteps_switchResult_4c0c6dfe: {}
                    - cliTools_joinSteps_switch_steps:
                        switch:
                        - condition: "${(cliTools_joinStepsIdx >= (0 + len(taskTools_joinStepsResult_633af29b)))}"
                          steps:
                          - cliTools_joinSteps_switch_updateResult_0:
                              assign:
                              - cliTools_joinSteps_switchResult_4c0c6dfe: "${buildCliToolsResult_5b6a634a[(cliTools_joinStepsIdx - (0 + len(taskTools_joinStepsResult_633af29b)))]}"
                        - condition: "${(cliTools_joinStepsIdx >= 0)}"
                          steps:
                          - cliTools_joinSteps_switch_updateResult_1:
                              assign:
                              - cliTools_joinSteps_switchResult_4c0c6dfe: "${taskTools_joinStepsResult_633af29b[(cliTools_joinStepsIdx - 0)]}"
                - cliTools_joinSteps_updateResult:
                    assign:
                    - cliTools_joinStepsResult_72d0b263: "${list.concat(cliTools_joinStepsResult_72d0b263, cliTools_joinSteps_switchResult_4c0c6dfe)}"
  - return:
      return:
        tools: "${cliTools_joinStepsResult_72d0b263}"
