                                                                  result: "logErrorResult_5106881c"
                                                            retry: "${http.default_retry}"
                                                        - reRaise:
                                                            raise: "${saveResult_newIdError}"
                                                        - saveResult_newId_updateResultError:
                                                            assign:
                                                            - saveResult_newIdResult_1d4d49cc: "${null}"
                                              - saveResult_write_messagesIsta_SegKala:
                                                  try:
                                                    steps:
                                                    - saveResult_write_messagesIsta_SegKala_call:
                                                        call: "http.post"
                                                        args:
                                                          url: "${((input.env.BASE_URL + \"/\") + \"firebase/create\")}"
                                                          body:
                                                            collection: "${(((\"convo.sessions/\" + input.env.sessionId) + \"/\") + \"messages\")}"
                                                            id: "${saveResult_newIdResult_1d4d49cc}"
                                                            contents:
                                                              value:
                                                                role: "${\"tool\"}"
                                                                content: "${callToolWorkflowResult_4406ad8a.encoded}"
                                                                tool_calls: "${[]}"
                                                                tool_call_id: "${forToolCallValue.id}"
                                                                create_time: "${sys.now()}"
                                                                docId: "${null}"
                                                              create_time: "${sys.now()}"
                                                              cost: "${null}"
                                                              execId: "${sys.get_env(\"GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID\")}"
                                                            userId: "${input.env.userId}"
                                                          auth:
                                                            type: "${\"OIDC\"}"
                                                            audience: "${input.env.BASE_URL}"
                                                          headers:
                                                            x-user-id: "${input.env.userId}"
                                                            x-project-id: "${input.env.projectId}"
                                                        result: "saveResult_write_messagesIsta_SegKalaResult_eddf3f7"
                                                  retry: "${http.default_retry}"
                                              - saveResult_update_session_update_time:
                                                  try:
                                                    steps:
                                                    - saveResult_update_session_update_time_call:
