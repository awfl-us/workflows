                                    - matchFunction_initResult:
                                        assign:
                                        - matchFunctionResult_25a01d32: {}
                                    - matchFunction_steps:
                                        switch:
                                        - condition: "${((forToolCallValue.function.name == foldValue.function.name) and default((map.get(foldValue, \"workflowName\") != null), false))}"
