main:
  params:
  - "input"
  steps:
  - segmentsForSession_block:
      steps:
      - segmentsForSession_fetch:
          try:
            steps:
            - segmentsForSession_fetch_call:
                call: "http.post"
                args:
                  url: "${((input.env.BASE_URL + \"/\") + \"firebase/segmentsForSession\")}"
                  body:
                    collection: "${(((\"convo.sessions/\" + input.env.sessionId) + \"/\") + \"messages\")}"
                    windowSeconds: "${default(input.windowSeconds, 1200)}"
                    overlapSeconds: "${default(input.overlapSeconds, 240)}"
                    userId: "${input.env.userId}"
                  auth:
                    type: "${\"OIDC\"}"
                    audience: "${input.env.BASE_URL}"
                  headers:
                    x-user-id: "${input.env.userId}"
                    x-project-id: "${input.env.projectId}"
                result: "segmentsForSession_fetchResult_13f5aabd"
          retry: "${http.default_retry}"
      - segmentsForSession_convert:
          steps:
          - segmentsForSession_convert_initResult:
              assign:
              - segmentsForSession_convertResult_fdb29a4: []
          - segmentsForSession_convert_steps:
              for:
                value: "segmentsForSession_convertValue"
                in: "${segmentsForSession_fetchResult_13f5aabd.body.segments}"
                steps:
                - segmentsForSession_convert_assignIterResult:
                    assign:
                    - segmentsForSession_convert_assignIterResultVar:
                        sessionId: "${input.env.sessionId}"
                        end: "${segmentsForSession_convertValue.end}"
                        windowSeconds: "${default(input.windowSeconds, 1200)}"
                - segmentsForSession_convert_updateResult:
                    assign:
                    - segmentsForSession_convertResult_fdb29a4: "${list.concat(segmentsForSession_convertResult_fdb29a4, segmentsForSession_convert_assignIterResultVar)}"
  - All_Latest_run:
      try:
        steps:
        - All_Latest_run_call:
            call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
            args:
              workflow_id: "${\"Summaries-All${WORKFLOW_ENV}\"}"
              argument:
                segmentEnd: "${segmentsForSession_convertResult_fdb29a4[(len(segmentsForSession_convertResult_fdb29a4) - 1)].end}"
                windowSeconds: "${1200}"
                overlapSeconds: "${240}"
                env:
                  userId: "${input.env.userId}"
                  model: "${input.env.model}"
                  callingWorkflowExec: "${default(\"WORKFLOW_EXECUTION_ID\", null)}"
                  BASE_URL: "${input.env.BASE_URL}"
                  background: "${default(map.get(input.env, \"background\"), null)}"
                  projectId: "${input.env.projectId}"
                  sessionId: "${input.env.sessionId}"
                  workdir: "${default(map.get(input.env, \"workdir\"), null)}"
              location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
              project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
              connector_params:
                skip_polling: false
            result: "All_Latest_runResult_22bcc77c"
      retry: "${http.default_retry}"
  - returnLatest:
      return: "${All_Latest_runResult_22bcc77c}"
  - return:
      return: "${All_Latest_runResult_22bcc77c}"
