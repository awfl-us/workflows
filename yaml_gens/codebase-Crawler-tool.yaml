main:
  params:
  - "input"
  steps:
  - runCommand_output:
      steps:
      - runCommand_call_block:
          steps:
          - runCommand_await_block:
              steps:
              - runCommand_run:
                  try:
                    steps:
                    - runCommand_run_call:
                        call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                        args:
                          workflow_id: "${\"tools-CliTools${WORKFLOW_ENV}\"}"
                          argument:
                            tool_call:
                              id: "${\"runCommand\"}"
                              type: "${\"function\"}"
                              function:
                                name: "${\"RUN_COMMAND\"}"
                                arguments: "${json.encode_to_string({\n  \"command\" : \"${json.decode(input.tool_call.function.arguments).producerCommand}\"\n})}"
                            cost: 0.0
                            env:
                              userId: "${input.env.userId}"
                              model: "${input.env.model}"
                              callingWorkflowExec: "${default(map.get(input.env, \"callingWorkflowExec\"), null)}"
                              BASE_URL: "${input.env.BASE_URL}"
                              background: "${default(default(map.get(input.env, \"background\"), false), null)}"
                              projectId: "${input.env.projectId}"
                              sessionId: "${input.env.sessionId}"
                          location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                          project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                          connector_params:
                            skip_polling: false
                        result: "runCommand_runResult_43b7c85a"
                  retry: "${http.default_retry}"
  - spawn:
      steps:
      - spawn_initResult:
          assign:
          - spawnResult_330ce748: []
      - spawn_steps:
          parallel:
            shared:
            - "spawnResult_330ce748"
            for:
              value: "spawnValue"
              in: "${text.split(map.get(json.decode(runCommand_runResult_43b7c85a.encoded), \"output\"), \"\\n\")}"
              steps:
              - codebase_Crawler:
                  try:
                    steps:
                    - codebase_Crawler_call:
                        call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                        args:
                          workflow_id: "${\"codebase-Crawler${WORKFLOW_ENV}\"}"
                          argument:
                            query: "${(((\"Your sole responsibility/area of focus is: \" + spawnValue) + \"\n\") + json.decode(input.tool_call.function.arguments).instructions)}"
                            fund: "${json.decode(input.tool_call.function.arguments).perCrawlerBudget}"
                            spent: "${default(0, null)}"
                            task: "${(((\"Your sole responsibility/area of focus is: \" + spawnValue) + \"\n\") + json.decode(input.tool_call.function.arguments).task)}"
                            toolChoice: "${default(null, null)}"
                            sideCall: "${default(false, null)}"
                            env:
                              userId: "${input.env.userId}"
                              model: "${input.env.model}"
                              callingWorkflowExec: "${default(map.get(input.env, \"callingWorkflowExec\"), null)}"
                              BASE_URL: "${input.env.BASE_URL}"
                              background: "${default(map.get(input.env, \"background\"), null)}"
                              projectId: "${input.env.projectId}"
                              sessionId: "${uuid.generate()}"
                          location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                          project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                          connector_params:
                            skip_polling: false
                        result: "codebase_CrawlerResult_12f6e441"
                  retry: "${http.default_retry}"
              - spawn_assignIterResult:
                  assign:
                  - spawn_assignIterResultVar:
                      response: "${(((\"Response from the agent assigned to \" + spawnValue) + \":\n\") + codebase_CrawlerResult_12f6e441.message.content)}"
                      cost: "${codebase_CrawlerResult_12f6e441.total_cost}"
              - spawn_updateResult:
                  assign:
                  - spawnResult_330ce748: "${list.concat(spawnResult_330ce748, spawn_assignIterResultVar)}"
  - sumSpent:
      steps:
      - sumSpent_initResult:
          assign:
          - sumSpentResult_75efc7de: "${0}"
      - sumSpent_steps:
          for:
            value: "sumSpentValue"
            in: "${spawnResult_330ce748}"
            steps:
            - sumSpent_updateResult:
                assign:
                - sumSpentResult_75efc7de: "${(sumSpentResult_75efc7de + sumSpentValue.cost)}"
  - return:
      return:
        encoded: "${json.encode_to_string(spawnResult_330ce748)}"
        cost: "${sumSpentResult_75efc7de}"
