main:
  params:
  - "input"
  steps:
  - readRaw_decode_content:
      steps:
      - readRaw_call_block:
          steps:
          - buildParams:
              steps:
              - buildParams_initResult:
                  assign:
                  - buildParamsResult_1978d66f: {}
              - buildParams_steps:
                  try:
                    steps:
                    - buildParams_updateResult:
                        assign:
                        - buildParamsResult_1978d66f:
                            filepath: "${input.filepath}"
                  except:
                    as: "buildParamsError"
                    steps:
                    - buildParams_logError:
                        try:
                          steps:
                          - buildParams_logError_call:
                              call: "sys.log"
                              args:
                                text: "${(\"[buildParams_logError] \" + buildParamsError.message)}"
                              result: "buildParams_logErrorResult_240d3253"
                        retry: "${http.default_retry}"
                    - buildParams_updateResultError:
                        assign:
                        - buildParamsResult_1978d66f: "${null}"
          - readRaw_await_block:
              steps:
              - readRaw_run:
                  try:
                    steps:
                    - readRaw_run_call:
                        call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                        args:
                          workflow_id: "${\"tools-CliTools${WORKFLOW_ENV}\"}"
                          argument:
                            tool_call:
                              id: "${\"readRaw\"}"
                              type: "${\"function\"}"
                              function:
                                name: "${\"READ_FILE\"}"
                                arguments: "${json.encode_to_string(buildParamsResult_1978d66f)}"
                            cost: 0.0
                            env:
                              userId: "${input.env.userId}"
                              model: "${input.env.model}"
                              callingWorkflowExec: "${default(map.get(input.env, \"callingWorkflowExec\"), null)}"
                              BASE_URL: "${input.env.BASE_URL}"
                              background: "${default(true, null)}"
                              projectId: "${input.env.projectId}"
                              sessionId: "${\"plaintify_write_hook\"}"
                          location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                          project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                          connector_params:
                            skip_polling: false
                        result: "readRaw_runResult_407a3fe3"
                  retry: "${http.default_retry}"
  - plainifyMessages:
      steps:
      - plainifyMessages_initResult:
          assign:
          - plainifyMessagesResult_1e24b9b0: []
      - plainifyMessages_steps:
          for:
            value: "plainifyMessagesIdx"
            range: "${[0, (2 - 1)]}"
            steps:
            - plainifyMessages_switch:
                steps:
                - plainifyMessages_switch_initResult:
                    assign:
                    - plainifyMessages_switchResult_3bcd9d9d: {}
                - plainifyMessages_switch_steps:
                    switch:
                    - condition: "${(plainifyMessagesIdx == 0)}"
                      steps:
                      - plainifyMessages_switch_updateResult_0:
                          assign:
                          - plainifyMessages_switchResult_3bcd9d9d:
                              role: "${\"system\"}"
                              content: "${(\"Translate the following code completely into precise, plain technical English. Include all types, methods, data flow, control flow, external interactions, and intent. No omissions. Include the full class signature in code, but the implementation and logic should be in plain English.\n\nTarget filepath: \" + input.filepath)}"
                              tool_calls: "${[]}"
                              tool_call_id: "${null}"
                              create_time: "${sys.now()}"
                              docId: "${null}"
                    - condition: "${(plainifyMessagesIdx == 1)}"
                      steps:
                      - plainifyMessages_switch_updateResult_1:
                          assign:
                          - plainifyMessages_switchResult_3bcd9d9d:
                              role: "${\"user\"}"
                              content: "${(\"Code follows:\n\n\" + map.get(json.decode(readRaw_runResult_407a3fe3.encoded), \"content\"))}"
                              tool_calls: "${[]}"
                              tool_call_id: "${null}"
                              create_time: "${sys.now()}"
                              docId: "${null}"
            - plainifyMessages_updateResult:
                assign:
                - plainifyMessagesResult_1e24b9b0: "${list.concat(plainifyMessagesResult_1e24b9b0, plainifyMessages_switchResult_3bcd9d9d)}"
  - chatBlock:
      steps:
      - toolChoice:
          steps:
          - toolChoice_initResult:
              assign:
              - toolChoiceResult_6055570a: {}
          - toolChoice_steps:
              switch:
              - condition: "${((null != null) and (len(null) > 0))}"
                steps:
                - toolChoice_updateResult_0:
                    assign:
                    - toolChoiceResult_6055570a: "${null}"
              - condition: "${true}"
                steps:
                - toolChoice_updateResult_1:
                    assign:
                    - toolChoiceResult_6055570a: "${null}"
      - plainify:
          try:
            steps:
            - plainify_call:
                call: "http.post"
                args:
                  url: "${((input.env.BASE_URL + \"/\") + \"llm/chat\")}"
                  body:
                    messages: "${plainifyMessagesResult_1e24b9b0}"
                    model: "${\"gpt-5\"}"
                    temperature: 0.8
                    max_completion_tokens: "${null}"
                    response_format:
                      type: "text"
                    tools: "${null}"
                    tool_choice: "${toolChoiceResult_6055570a}"
                  auth:
                    type: "${\"OIDC\"}"
                    audience: "${input.env.BASE_URL}"
                  headers:
                    x-user-id: "${input.env.userId}"
                    x-project-id: "${input.env.projectId}"
                result: "plainifyResult_24b39cc0"
          retry: "${http.default_retry}"
  - mkdirPlain_output:
      steps:
      - mkdirPlain_call_block:
          steps:
          - buildParams_1:
              steps:
              - buildParams_initResult_1:
                  assign:
                  - buildParamsResult_43f4ed8d: {}
              - buildParams_steps_1:
                  try:
                    steps:
                    - buildParams_updateResult_1:
                        assign:
                        - buildParamsResult_43f4ed8d:
                            command: "${((\"bash -lc 'mkdir -p $(dirname \" + (\"plain/\" + input.filepath)) + \")'\")}"
                  except:
                    as: "buildParamsError"
                    steps:
                    - buildParams_logError_1:
                        try:
                          steps:
                          - buildParams_logError_call_1:
                              call: "sys.log"
                              args:
                                text: "${(\"[buildParams_logError] \" + buildParamsError.message)}"
                              result: "buildParams_logErrorResult_240d3253"
                        retry: "${http.default_retry}"
                    - buildParams_updateResultError_1:
                        assign:
                        - buildParamsResult_43f4ed8d: "${null}"
          - mkdirPlain_await_block:
              steps:
              - mkdirPlain_run:
                  try:
                    steps:
                    - mkdirPlain_run_call:
                        call: "googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run"
                        args:
                          workflow_id: "${\"tools-CliTools${WORKFLOW_ENV}\"}"
                          argument:
                            tool_call:
                              id: "${\"mkdirPlain\"}"
                              type: "${\"function\"}"
                              function:
                                name: "${\"RUN_COMMAND\"}"
                                arguments: "${json.encode_to_string(buildParamsResult_43f4ed8d)}"
                            cost: 0.0
                            env:
                              userId: "${input.env.userId}"
                              model: "${input.env.model}"
                              callingWorkflowExec: "${default(map.get(input.env, \"callingWorkflowExec\"), null)}"
                              BASE_URL: "${input.env.BASE_URL}"
                              background: "${default(true, null)}"
                              projectId: "${input.env.projectId}"
                              sessionId: "${\"plaintify_write_hook\"}"
                          location: "${sys.get_env(\"GOOGLE_CLOUD_LOCATION\")}"
                          project_id: "${sys.get_env(\"GOOGLE_CLOUD_PROJECT_ID\")}"
                          connector_params:
                            skip_polling: false
                        result: "mkdirPlain_runResult_1a0a9772"
                  retry: "${http.default_retry}"
  - writePlain_encoded:
      steps:
      - writePlain_call_block:
          steps:
          - buildParams_2:
              steps:
              - buildParams_initResult_2:
                  assign:
                  - buildParamsResult_3c939778: {}
              - buildParams_steps_2:
                  try:
                    steps:
                    - buildParams_updateResult_2:
                        assign:
                        - buildParamsResult_3c939778:
                            filepath: "${(\"plain/\" + input.filepath)}"
                            content: "${plainifyResult_24b39cc0.body.message.content}"
                  except:
                    as: "buildParamsError"
                    steps:
                    - buildParams_logError_2:
                        try:
                          steps:
                          - buildParams_logError_call_2:
